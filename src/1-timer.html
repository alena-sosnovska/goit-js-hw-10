<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:wght@700&family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <section class="timer-section">
          <a class="back-link" href="./index.html">Go back</a>
          <div class="datetime-picker">
            <input type="text" id="datetime-picker" class="datetime-input" />
            <button type="button" class="start-button" data-start>Start</button>
          </div>

          <div class="timer">
            <div class="field">
              <span class="value" data-days>00</span>
              <span class="label">DAYS</span>
            </div>
            <div class="field">
              <span class="value" data-hours>00</span>
              <span class="label">HOURS</span>
            </div>
            <div class="field">
              <span class="value" data-minutes>00</span>
              <span class="label">MINUTES</span>
            </div>
            <div class="field">
              <span class="value" data-seconds>00</span>
              <span class="label">SECONDS</span>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./js/1-timer.js"></script>
  </body>
</html>
